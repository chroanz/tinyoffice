# Infra de desenvolvimento do PixelRooms.
# Fase atual: apenas Postgres e Redis.
# Fases futuras (ver ESPECIFICACAO.md §10): livekit (SFU), coturn (TURN),
# caddy (TLS) e as imagens do backend/frontend para deploy de produção.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixelrooms
      POSTGRES_PASSWORD: pixelrooms
      POSTGRES_DB: pixelrooms
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelrooms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

